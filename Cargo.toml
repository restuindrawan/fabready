[workspace]
resolver = "2"
members = ["crates/fabready-core", "crates/fabready-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Restu Indrawan"]
repository = "https://github.com/restuindrawan/fabready"

[workspace.dependencies]
fabready-core = { path = "crates/fabready-core" }
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
